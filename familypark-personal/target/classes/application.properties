# =============================================================
# FamilyPark - Microservicio de Personal
# application.properties
# =============================================================

spring.application.name=familypark-personal
server.port=8083

# =============================================================
# DATASOURCE — MySQL
# =============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/familyparkpersonal?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Pool de conexiones HikariCP
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# =============================================================
# JPA / HIBERNATE
# =============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# =============================================================
# JACKSON — Serialización de fechas
# =============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Santiago

# =============================================================
# LOGGING
# =============================================================
logging.level.cl.familypark=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
